[package]
name = "agentgw"
version = "0.56.0"
edition = "2024"
license = "MIT"

# Why target/ grew to 32GB (measured 2026-08-01): with full debuginfo each artifact is huge,
# and cargo never deletes old generations — 48,374 `.o` files and 214 incremental generations
# had piled up. We don't use debug info, so drop it (panic backtraces still show function
# names; if line numbers are ever needed, raise this to `debug = "line-tables-only"`).
# Build time, median of 3 runs under the same conditions: 11.8s -> 11.6s (noise) = smaller
# output at no cost in speed
[profile.dev]
debug = 0

# The release build is **what gets copied to other machines** (add-machine). The default
# would ship it with its symbols, so strip them. No lto — the longer build time costs too
# much in this repo, where parallel workers compete for target/
[profile.release]
strip = true
# **Only this crate is built at 1.** Measured on 2026-09-22 (Mac target, dependencies cached, our
# crate rebuilt alone): 182s at 3, 116s at 1, 67s at 0. Level 1 takes ~36% off every deploy build
# and leaves the binary the same size; 0 is faster still but grows it from 13MB to 19MB.
#
# What stays at 3 is everything that does the work worth optimizing: TLS, the JSON parser, the
# async runtime, the HTTP stack. What drops to 1 is this crate, whose per-message work is building
# strings and reading a terminal screen, between network waits that dwarf it.
opt-level = 1

# **Dependencies stay at 3, which also keeps their cache.** Their artifacts are fingerprinted with
# the profile, so letting the knob above reach them would rebuild ~150 crates on every change of it
# (measured: 9m21s).
[profile.release.package."*"]
opt-level = 3

[dependencies]
tokio = { version = "1", features = ["full"] }
slack-morphism = { version = "2.29", features = ["hyper"] }
rmcp = { version = "0.8", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# WebSocket is a Stream/Sink, so driving it needs these two traits. rmcp / axum / slack-morphism
# already pull the same version, so there is no new compile (without the declaration we just
# can't name the traits)
futures-util = { version = "0.3", default-features = false }
# base64url for the connection string. **Replaces 40 hand-written lines** — it is already in
# the dependency graph, so there is no new compile (slack-morphism / rmcp pull it)
base64 = "0.22"
# Calendar math (leap years, days per month, day of year, time formatting). **Replaces 150
# hand-written lines** — rmcp / schemars / slack-morphism already pull the same version, so
# there is no new compile
chrono = "0.4"
# To build the Slack app creation link (a URL carrying the manifest). url / reqwest already
# pull the same version, so there is no new compile
percent-encoding = "2"
# Async traits that can sit behind `Arc<dyn …>` (Chat, Agent — each next to its own module).
# slack-morphism already pulls the same version, so there is no new compile
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Checking a downloaded release against its .sha256. Already pulled in by the TLS stack, so
# there is no new compile
sha2 = "0.11"
schemars = "1"
