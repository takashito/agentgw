[package]
name = "agentgw"
version = "0.22.2"
edition = "2024"
license = "MIT"

# target が 32GB まで育った原因(2026-08-01 実測): debuginfo フルだと成果物1つが巨大で、
# cargo は古い世代を消さない — `.o` が 48,374 個 / incremental が 214 世代溜まっていた。
# デバッグ情報は使っていないので落とす(パニック時のバックトレースは関数名までは出る。
# 行番号が要る場面が来たら `debug = "line-tables-only"` に上げる)。
# ビルド時間は同条件3回の中央値で 11.8s → 11.6s(誤差)= 速度の代償なしでサイズだけ落ちる
[profile.dev]
debug = 0

# リリース版は**他のマシンへ scp する物**(add-child)。既定のままだとシンボルを
# 抱えたまま運ぶことになるので落とす。lto は入れない — ビルド時間が伸びる側の代償が、
# 並行ワーカーで target/ を取り合っているこのリポでは重い
[profile.release]
strip = true

[dependencies]
tokio = { version = "1", features = ["full"] }
slack-morphism = { version = "2", features = ["hyper"] }
rmcp = { version = "0.8", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# WebSocket は Stream/Sink なので、駆動にこの2 trait が要る。rmcp / axum / slack-morphism が
# 既に同版を引いているので新規コンパイルは無い(宣言していないと trait を名前で呼べないだけ)
futures-util = { version = "0.3", default-features = false }
# 接続文字列の base64url。**自前で40行持っていたものを畳んだ** — 既に依存グラフに居るので
# 新規コンパイルは無い(slack-morphism / rmcp が引いている)
base64 = "0.22"
# 暦(うるう年・月の日数・通算日・時刻の書式)。**自前で持っていた 150 行を畳んだ** —
# rmcp / schemars / slack-morphism が既に同版を引いているので新規コンパイルは無い
chrono = "0.4"
# Slack アプリの作成リンク(マニフェスト入りの URL)を組むため。url / reqwest が既に同版を
# 引いているので新規コンパイルは無い
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
