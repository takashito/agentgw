# `cargo dist` = build what we ship. **Both the Mac and the Linux builds** in one command.
#
# This is an alias, not a default (`[build] target`). An array in `[build] target` becomes
# **the default for every cargo command**, so `cargo build` and `cargo test` would also try
# to link for musl and fail (measured: `ld: unknown options: --as-needed -Bstatic …` — GNU-style
# options get passed to the Mac ld). As an alias, the dev loop is untouched.
#
# zigbuild is there to get musl through (static linking = works with any glibc version on the
# other side). It links the Mac build fine too (Mach-O 64-bit executable arm64).
# Tools needed: brew install zig cargo-zigbuild && rustup target add <triple>
#
# **The triples are hard-coded.** This repo assumes shipping from one Mac; to add a target,
# add it here (each one adds about 80 seconds).
[alias]
dist = "zigbuild --release --target aarch64-apple-darwin --target x86_64-unknown-linux-musl"
